<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divergence and Curl Comparison</title>
  <style>
    :root{
      --bg:#ffffff; --card:#ffffff; --text:#111827; --muted:#6b7280;
      --border:#d1d5db; --accent-bg:#dbeafe;
      --field:#2563eb; --probe:#111827; --parcel:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Arial,"Noto Sans KR",sans-serif;
    }
    .wrap{max-width:1320px;margin:0 auto;padding:20px}
    h1{font-size:28px;margin:0 0 14px}
    .top{
      display:grid;grid-template-columns:minmax(0,1fr) 320px;
      gap:16px;align-items:start;margin-bottom:16px;
    }
    .card{
      border:1px solid var(--border);border-radius:14px;background:var(--card);
      padding:12px;
    }
    .controls{display:grid;gap:12px}
    .label{font-weight:700;margin-bottom:6px}
    .muted{color:var(--muted);font-size:14px;line-height:1.55}
    input[type=range]{width:100%}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{
      min-height:40px;padding:8px 13px;border:1px solid var(--border);
      border-radius:9px;background:#fff;color:var(--text);cursor:pointer;font-size:14px;
    }
    button.primary{background:var(--accent-bg)}
    .math{font-family:Consolas,Monaco,monospace;font-size:15px;line-height:1.7}
    .grid{
      display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
    }
    .panel{
      border:1px solid var(--border);border-radius:14px;background:#fff;padding:12px;
    }
    .panel h2{font-size:18px;margin:0 0 8px}
    .eq{font-family:Consolas,Monaco,monospace;font-size:15px;line-height:1.6;margin:0 0 8px}
    canvas{
      display:block;width:100%;height:auto;background:#fff;border-radius:10px;
      border:1px solid #e5e7eb;
    }
    .stat{
      display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
      font-size:14px;
    }
    .badge{
      border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fafafa;
    }
    .legend{
      margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5;
    }
    @media(max-width:980px){
      .top,.grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<main class="wrap">
  <h1>Divergence and Curl Comparison</h1>

  <div class="top">
    <section class="card">
      <div class="math">
        div F = ∂F₁/∂x + ∂F₂/∂y
        &nbsp;&nbsp;&nbsp;
        curl F = ∂F₂/∂x - ∂F₁/∂y
      </div>
    </section>

    <aside class="card controls">
      <section>
        <div class="label">t</div>
        <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0">
        <div class="muted">t = <span id="timeVal">0.00</span></div>
      </section>

      <section>
        <div class="label">speed</div>
        <input id="speedSlider" type="range" min="0.4" max="1.8" step="0.1" value="1.0">
        <div class="muted"><span id="speedVal">1.0</span></div>
      </section>

      <div class="buttons">
        <button id="playBtn" class="primary" type="button">재생</button>
        <button id="resetBtn" type="button">초기화</button>
      </div>
    </aside>
  </div>

  <div class="grid">
    <section class="panel">
      <h2>1. Divergence</h2>
      <div class="eq">F(x,y) = (x, y)</div>
      <canvas id="cv1" width="380" height="380" aria-label="순수 발산 벡터장"></canvas>
      <div class="stat">
        <div class="badge">div F = <strong>2</strong></div>
        <div class="badge">curl F = <strong>0</strong></div>
      </div>
      
    </section>

    <section class="panel">
      <h2>2. Curl</h2>
      <div class="eq">F(x,y) = (-y, x)</div>
      <canvas id="cv2" width="380" height="380" aria-label="순수 회전 벡터장"></canvas>
      <div class="stat">
        <div class="badge">div F = <strong>0</strong></div>
        <div class="badge">curl F = <strong>2</strong></div>
      </div>
      
    </section>

    <section class="panel">
      <h2>3. Divergence + Curl</h2>
      <div class="eq">F(x,y) = (x - y, x + y)</div>
      <canvas id="cv3" width="380" height="380" aria-label="발산과 회전이 함께 있는 벡터장"></canvas>
      <div class="stat">
        <div class="badge">div F = <strong>2</strong></div>
        <div class="badge">curl F = <strong>2</strong></div>
      </div>
      
    </section>
  </div>
</main>

<script>
(() => {
  const timeSlider = document.getElementById('timeSlider');
  const speedSlider = document.getElementById('speedSlider');
  const timeVal = document.getElementById('timeVal');
  const speedVal = document.getElementById('speedVal');
  const playBtn = document.getElementById('playBtn');
  const resetBtn = document.getElementById('resetBtn');

  let playing = false;
  let lastTime = performance.now();

  const configs = [
    {
      canvas: document.getElementById('cv1'),
      field: (x,y) => [x,y],
      title: 'pure divergence',
      div: 2, curl: 0
    },
    {
      canvas: document.getElementById('cv2'),
      field: (x,y) => [-y,x],
      title: 'pure curl',
      div: 0, curl: 2
    },
    {
      canvas: document.getElementById('cv3'),
      field: (x,y) => [x-y,x+y],
      title: 'divergence + curl',
      div: 2, curl: 2
    }
  ];

  function map(canvas, x, y){
    const pad = 34;
    const xmin = -2.4, xmax = 2.4, ymin = -2.4, ymax = 2.4;
    const X = pad + (x-xmin)/(xmax-xmin)*(canvas.width-2*pad);
    const Y = canvas.height-pad - (y-ymin)/(ymax-ymin)*(canvas.height-2*pad);
    return [X,Y];
  }

  function drawArrow(ctx, canvas, x, y, u, v, color, scale=1){
    const A = map(canvas, x, y);
    const B = map(canvas, x + u*scale, y + v*scale);

    ctx.beginPath();
    ctx.moveTo(A[0],A[1]);
    ctx.lineTo(B[0],B[1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();

    const dx=B[0]-A[0], dy=B[1]-A[1];
    const L=Math.hypot(dx,dy)||1;
    const ux=dx/L, uy=dy/L, px=-uy, py=ux, s=8;

    ctx.beginPath();
    ctx.moveTo(B[0],B[1]);
    ctx.lineTo(B[0]-ux*s+px*4, B[1]-uy*s+py*4);
    ctx.lineTo(B[0]-ux*s-px*4, B[1]-uy*s-py*4);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawBackground(ctx, canvas, field){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const pad=34;
    const O=map(canvas,0,0);
    ctx.strokeStyle='#cbd5e1';
    ctx.lineWidth=1.1;

    ctx.beginPath();
    ctx.moveTo(pad,O[1]); ctx.lineTo(canvas.width-pad,O[1]); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(O[0],pad); ctx.lineTo(O[0],canvas.height-pad); ctx.stroke();

    ctx.fillStyle='#64748b';
    ctx.font='13px Arial';
    ctx.fillText('x', canvas.width-pad+10, O[1]+4);
    ctx.fillText('y', O[0]+8, pad-10);

    for(let x=-2;x<=2.001;x+=0.8){
      for(let y=-2;y<=2.001;y+=0.8){
        const [u,v] = field(x,y);
        const m = Math.hypot(u,v);
        if(m < 0.05) continue;
        drawArrow(ctx, canvas, x, y, u/m, v/m, '#2563eb', 0.28);
      }
    }
  }

  function drawProbe(ctx, canvas, div, curl, tNorm){
    const T = 0.95 * tNorm;                   // animation time horizon
    const growth = div/2;                     // radial growth rate
    const omega = curl/2;                     // angular velocity
    const r0 = 0.32;
    const r = r0 * Math.exp(growth * T);      // local parcel radius
    const phi = omega * T;                    // wheel rotation angle

    // parcel circle
    const C = map(canvas,0,0);
    const R = Math.abs(map(canvas,r,0)[0] - C[0]);

    ctx.beginPath();
    ctx.arc(C[0],C[1],R,0,2*Math.PI);
    ctx.fillStyle='rgba(245,158,11,0.18)';
    ctx.fill();
    ctx.strokeStyle='#d97706';
    ctx.lineWidth=2;
    ctx.stroke();

    // wheel spokes
    ctx.strokeStyle='#111827';
    ctx.lineWidth=2.4;
    for(let i=0;i<8;i++){
      const a = phi + i*Math.PI/4;
      const x1 = C[0], y1 = C[1];
      const x2 = C[0] + R*Math.cos(a);
      const y2 = C[1] - R*Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(C[0],C[1],5,0,2*Math.PI);
    ctx.fillStyle='#111827';
    ctx.fill();

    // directional cue for rotation
    if(Math.abs(curl) > 1e-9){
      const rr = R + 18;
      const start = 1.1*Math.PI;
      const end = 0.2*Math.PI;
      ctx.beginPath();
      for(let i=0;i<=30;i++){
        const a = start + (end-start)*i/30;
        const x = C[0] + rr*Math.cos(a);
        const y = C[1] - rr*Math.sin(a);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle='#059669';
      ctx.lineWidth=2.4;
      ctx.stroke();

      const a = end;
      const x = C[0] + rr*Math.cos(a);
      const y = C[1] - rr*Math.sin(a);
      const tx = -Math.sin(a);
      const ty = -Math.cos(a);
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x - tx*10 + ty*5, y - ty*10 - tx*5);
      ctx.lineTo(x - tx*10 - ty*5, y - ty*10 + tx*5);
      ctx.closePath();
      ctx.fillStyle='#059669';
      ctx.fill();
    }


  }

  function renderPanel(cfg){
    const ctx = cfg.canvas.getContext('2d');
    drawBackground(ctx, cfg.canvas, cfg.field);
    drawProbe(ctx, cfg.canvas, cfg.div, cfg.curl, Number(timeSlider.value));
  }

  function renderAll(){
    timeVal.textContent = Number(timeSlider.value).toFixed(2);
    speedVal.textContent = Number(speedSlider.value).toFixed(1);
    configs.forEach(renderPanel);
  }

  timeSlider.addEventListener('input', renderAll);
  speedSlider.addEventListener('input', renderAll);

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? '일시정지' : '재생';
    lastTime = performance.now();
  });

  resetBtn.addEventListener('click', () => {
    playing = false;
    playBtn.textContent = '재생';
    timeSlider.value = '0';
    speedSlider.value = '1.0';
    renderAll();
  });

  function tick(now){
    const dt = Math.min(0.05, (now-lastTime)/1000);
    lastTime = now;

    if(playing){
      const speed = Number(speedSlider.value);
      let t = Number(timeSlider.value) + dt * 0.35 * speed;
      if(t > 1) t = 0;
      timeSlider.value = String(t);
      renderAll();
    }
    requestAnimationFrame(tick);
  }

  renderAll();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
