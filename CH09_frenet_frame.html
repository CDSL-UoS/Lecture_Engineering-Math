<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frenet Frame</title>
  <style>
    :root{
      --bg:#ffffff; --card:#ffffff; --text:#111827;
      --muted:#6b7280; --border:#d1d5db; --accent-bg:#dbeafe;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:Arial,"Noto Sans KR",sans-serif;
    }
    .wrap{max-width:1120px;margin:0 auto;padding:20px}
    h1{font-size:26px;margin:0 0 14px}
    .layout{
      display:grid;grid-template-columns:minmax(0,1fr) 280px;
      gap:16px;align-items:start;
    }
    .viz,.card{
      border:1px solid var(--border);
      border-radius:14px;background:var(--card);
    }
    .viz{padding:10px}
    canvas{display:block;width:100%;height:auto;background:#fff;border-radius:10px}
    .side{display:grid;gap:12px}
    .card{padding:12px}
    .label{font-weight:700;margin-bottom:7px}
    input[type=range]{width:100%}
    .muted{color:var(--muted);font-size:14px}
    .math{
      font-family:Consolas,Monaco,monospace;
      font-size:15px;line-height:1.75;
    }
    .legend{display:grid;gap:7px;font-size:14px}
    .legend span{display:flex;align-items:center;gap:8px}
    .swatch{width:18px;height:4px;border-radius:4px;display:inline-block}
    .plane{width:18px;height:12px;background:rgba(245,158,11,.28);border:1px solid #d97706}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{
      min-height:40px;padding:8px 13px;border:1px solid var(--border);
      border-radius:9px;background:#fff;color:var(--text);cursor:pointer;font-size:14px;
    }
    button.primary{background:var(--accent-bg)}
    @media(max-width:820px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Frenet Frame</h1>

  <div class="layout">
    <section class="viz">
      <canvas id="cv" width="780" height="640" aria-label="Frenet frame 시각화"></canvas>
    </section>

    <aside class="side">
      <section class="card">
        <div class="label">t</div>
        <input id="slider" type="range" min="0" max="18.8495559" step="0.01" value="6.8">
        <div class="muted">t = <span id="tval">6.80</span></div>
      </section>

      <section class="card">
        <div class="math">
          r(t) = (cos t, sin t, 0.25t)<br><br>
          u = <span id="Ttxt"></span><br>
          p = <span id="Ntxt"></span><br>
          b = <span id="Btxt"></span><br><br>
          κ = <span id="kappaTxt"></span><br>
          τ = <span id="tauTxt"></span>
        </div>
      </section>

      <section class="card">
        <div class="legend">
          <span><i class="swatch" style="background:#2563eb"></i> u</span>
          <span><i class="swatch" style="background:#dc2626"></i> p</span>
          <span><i class="swatch" style="background:#059669"></i> b</span>
          <span><i class="plane"></i> Osculating plane</span>
        </div>
      </section>

      <div class="buttons">
        <button id="play" class="primary" type="button">재생</button>
        <button id="reset" type="button">초기화</button>
      </div>
    </aside>
  </div>
</main>

<script>
(() => {
  const canvas=document.getElementById('cv');
  const ctx=canvas.getContext('2d');
  const slider=document.getElementById('slider');
  const tval=document.getElementById('tval');
  const Ttxt=document.getElementById('Ttxt');
  const Ntxt=document.getElementById('Ntxt');
  const Btxt=document.getElementById('Btxt');
  const kappaTxt=document.getElementById('kappaTxt');
  const tauTxt=document.getElementById('tauTxt');
  const playBtn=document.getElementById('play');
  const resetBtn=document.getElementById('reset');

  let yaw=-0.65,pitch=0.48,dragging=false,lastX=0,lastY=0;
  let playing=false,lastTime=performance.now();
  const c=0.25;

  const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
  const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
  const norm=a=>Math.hypot(a[0],a[1],a[2]);
  const unit=a=>{const n=norm(a);return[a[0]/n,a[1]/n,a[2]/n];};
  const cross=(a,b)=>[
    a[1]*b[2]-a[2]*b[1],
    a[2]*b[0]-a[0]*b[2],
    a[0]*b[1]-a[1]*b[0]
  ];

  function r(t){return[Math.cos(t),Math.sin(t),c*t];}

  function frameAt(t){
    const u=unit([-Math.sin(t),Math.cos(t),c]);
    const p=[-Math.cos(t),-Math.sin(t),0];
    const b=unit(cross(u,p));
    const kappa=1/(1+c*c);
    const tau=c/(1+c*c);
    return{pos:r(t),u,p,b,kappa,tau};
  }

  function rotate(P){
    let[x,y,z]=P;
    const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const cp=Math.cos(pitch),sp=Math.sin(pitch);

    const x1=cy*x+sy*z;
    const z1=-sy*x+cy*z;
    const y1=y;

    return[x1,cp*y1-sp*z1,sp*y1+cp*z1];
  }

  function project(P){
    const q=rotate(P),s=125;
    return[canvas.width/2+q[0]*s,canvas.height/2-q[1]*s,q[2]];
  }

  function drawLine3(a,b,color,width=2){
    const A=project(a),B=project(b);
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  }

  function drawArrow3(pos,v,color,label,scale=1){
    const end=add(pos,mul(v,scale));
    const A=project(pos),B=project(end);
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);
    ctx.strokeStyle=color;ctx.lineWidth=4;ctx.stroke();

    const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1;
    const ux=dx/L,uy=dy/L,px=-uy,py=ux,s=12;
    ctx.beginPath();
    ctx.moveTo(B[0],B[1]);
    ctx.lineTo(B[0]-ux*s+px*6,B[1]-uy*s+py*6);
    ctx.lineTo(B[0]-ux*s-px*6,B[1]-uy*s-py*6);
    ctx.closePath();ctx.fillStyle=color;ctx.fill();

    ctx.font='bold 18px Arial';ctx.fillStyle=color;
    ctx.fillText(label,B[0]+8,B[1]-8);
  }

  function drawPlane(pos,u,p){
    const s=0.85;
    const pts=[
      add(add(pos,mul(u,s)),mul(p,s)),
      add(add(pos,mul(u,-s)),mul(p,s)),
      add(add(pos,mul(u,-s)),mul(p,-s)),
      add(add(pos,mul(u,s)),mul(p,-s))
    ].map(project);

    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();
    ctx.fillStyle='rgba(245,158,11,0.20)';ctx.fill();
    ctx.strokeStyle='#d97706';ctx.lineWidth=1.5;ctx.stroke();
  }

  function drawAxes(){
    drawLine3([-2.4,0,0],[2.4,0,0],'#cbd5e1',1);
    drawLine3([0,-2.4,0],[0,2.4,0],'#cbd5e1',1);
    drawLine3([0,0,-0.3],[0,0,5.2],'#cbd5e1',1);

    const X=project([2.5,0,0]),Y=project([0,2.5,0]),Z=project([0,0,5.3]);
    ctx.fillStyle='#64748b';ctx.font='15px Arial';
    ctx.fillText('x',X[0]+4,X[1]);
    ctx.fillText('y',Y[0]+4,Y[1]);
    ctx.fillText('z',Z[0]+4,Z[1]);
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    drawAxes();

    const pts=[];
    for(let t=0;t<=6*Math.PI+0.03;t+=0.045)pts.push(project(r(t)));
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.strokeStyle='#475569';ctx.lineWidth=2.5;ctx.stroke();

    const t=Number(slider.value),F=frameAt(t);
    drawPlane(F.pos,F.u,F.p);

    const P=project(F.pos);
    ctx.beginPath();ctx.arc(P[0],P[1],7,0,Math.PI*2);
    ctx.fillStyle='#111827';ctx.fill();

    drawArrow3(F.pos,F.u,'#2563eb','u',1.0);
    drawArrow3(F.pos,F.p,'#dc2626','p',1.0);
    drawArrow3(F.pos,F.b,'#059669','b',1.0);

    tval.textContent=t.toFixed(2);
    Ttxt.textContent=`(${F.u.map(v=>v.toFixed(3)).join(', ')})`;
    Ntxt.textContent=`(${F.p.map(v=>v.toFixed(3)).join(', ')})`;
    Btxt.textContent=`(${F.b.map(v=>v.toFixed(3)).join(', ')})`;
    kappaTxt.textContent=F.kappa.toFixed(4);
    tauTxt.textContent=F.tau.toFixed(4);
  }

  slider.addEventListener('input',render);

  canvas.addEventListener('pointerdown',e=>{
    dragging=true;lastX=e.clientX;lastY=e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    lastX=e.clientX;lastY=e.clientY;
    yaw+=dx*0.008;
    pitch=Math.max(-1.25,Math.min(1.25,pitch+dy*0.008));
    render();
  });

  canvas.addEventListener('pointerup',e=>{
    dragging=false;
    try{canvas.releasePointerCapture(e.pointerId);}catch(_){}
  });

  playBtn.addEventListener('click',()=>{
    playing=!playing;
    playBtn.textContent=playing?'일시정지':'재생';
    lastTime=performance.now();
  });

  resetBtn.addEventListener('click',()=>{
    slider.value='6.8';
    yaw=-0.65;pitch=0.48;playing=false;
    playBtn.textContent='재생';
    render();
  });

  function animate(now){
    const dt=Math.min(0.05,(now-lastTime)/1000);
    lastTime=now;

    if(playing){
      let t=Number(slider.value)+dt*0.9;
      if(t>6*Math.PI)t=0;
      slider.value=t;
      render();
    }
    requestAnimationFrame(animate);
  }

  render();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
