<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경로 독립성과 퍼텐셜</title><style>
:root{--bg:#ffffff;--panel:#ffffff;--ink:#111827;--muted:#4b5563;--accent:#0ea5e9;--accent2:#7c3aed;--good:#16a34a;--warn:#d97706;--line:#d1d5db}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Noto Sans KR,Arial,sans-serif;background:#ffffff;color:var(--ink)}
header{padding:22px 24px 10px;max-width:1200px;margin:auto}
h1{font-size:clamp(24px,3vw,38px);margin:0 0 6px} h2{margin:0 0 12px} p{color:var(--muted);line-height:1.55}
.wrap{max-width:1200px;margin:auto;padding:12px 24px 30px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:18px}
.card{background:#ffffff;border:1px solid var(--line);border-radius:8px;padding:16px;}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#ffffff;border:1px solid #d1d5db}
label{display:block;font-size:13px;color:#374151;margin:12px 0 5px}
input[type=range], select{width:100%}
button{cursor:pointer;background:#f3f4f6;color:#111827;border:1px solid #cbd5e1;border-radius:10px;padding:9px 12px;margin:4px 5px 4px 0}
button:hover{background:#e5e7eb}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi div{background:#f8fafc;border:1px solid #d1d5db;border-radius:8px;padding:10px}
.kpi b{display:block;font-size:19px;color:#111827}
.eq{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f8fafc;border:1px solid #d1d5db;border-radius:8px;padding:12px;line-height:1.6;color:#111827;overflow:auto}
.note{font-size:13px;color:#4b5563}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#374151;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
a{color:#0369a1}
</style></head><body>
<header><h1>경로 독립성과 퍼텐셜</h1><p><b>F=∇φ</b>이면 선적분은 경로와 무관합니다.</p></header>
<div class="wrap"><div class="grid"><div class="card"><canvas id="cv" width="760" height="520"></canvas></div>
<div class="card"><label>퍼텐셜 기울기 세기 a</label><input id="a" type="range" min="0.4" max="2.5" value="1" step=".05">
<label>끝점 B의 x좌표</label><input id="bx" type="range" min=".4" max="2.2" value="1.6" step=".02"><label>끝점 B의 y좌표</label><input id="by" type="range" min="-.2" max="1.8" value="1.1" step=".02">
<div class="kpi"><div>φ(B)-φ(A)<b id="pot"></b></div><div>세 경로 최대 오차<b id="err"></b></div></div>
<div class="eq">φ(x,y)=a(x²+y²)<br>F=∇φ=(2ax,2ay)<br>∫<sub>C</sub>F·dr = φ(B)-φ(A)</div><p class="note">직선, 사인 곡선, L자 경로를 비교합니다.</p></div></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),A=[-1.3,-.8];
function val(id){return +document.getElementById(id).value} function B(){return [val('bx'),val('by')]}
function F(x,y){let a=val('a');return [2*a*x,2*a*y]} function phi(p){let a=val('a');return a*(p[0]*p[0]+p[1]*p[1])}
function paths(){let b=B();return [
s=>[A[0]+(b[0]-A[0])*s,A[1]+(b[1]-A[1])*s],
s=>[A[0]+(b[0]-A[0])*s,A[1]+(b[1]-A[1])*s+1.2*Math.sin(Math.PI*s)],
s=>s<.5?[A[0],A[1]+2*s*(b[1]-A[1])]:[A[0]+2*(s-.5)*(b[0]-A[0]),b[1]]
]}
function integ(fn){let n=1200,sum=0,p=fn(0);for(let i=1;i<=n;i++){let q=fn(i/n),m=[(p[0]+q[0])/2,(p[1]+q[1])/2],f=F(...m);sum+=f[0]*(q[0]-p[0])+f[1]*(q[1]-p[1]);p=q}return sum}
function map(x,y){return [cv.width/2+x*130,cv.height/2-y*130]}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(let x=-2.5;x<=2.5;x+=.4)for(let y=-1.8;y<=1.8;y+=.4){let [u,v]=F(x,y),m=Math.hypot(u,v)||1,s=.18/m,[X,Y]=map(x,y),[X2,Y2]=map(x+u*s,y+v*s);ctx.strokeStyle='#64748b';ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X2,Y2);ctx.stroke()}
let ps=paths(),cols=['#6ee7ff','#a78bfa','#7ee787'];ps.forEach((fn,k)=>{ctx.strokeStyle=cols[k];ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=220;i++){let q=map(...fn(i/220));i?ctx.lineTo(...q):ctx.moveTo(...q)}ctx.stroke()});
for(let item of [[A,'A'],[B(),'B']]){let q=map(...item[0]);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(...q,6,0,7);ctx.fill();ctx.fillText(item[1],q[0]+9,q[1]-8)}
let target=phi(B())-phi(A),vals=ps.map(integ),err=Math.max(...vals.map(x=>Math.abs(x-target)));document.getElementById('pot').textContent=target.toFixed(4);document.getElementById('err').textContent=err.toExponential(1);
ctx.fillStyle='#111827';ctx.font='14px system-ui';vals.forEach((vv,i)=>ctx.fillText('경로 '+(i+1)+' = '+vv.toFixed(4),20,28+i*22))}
['a','bx','by'].forEach(id=>document.getElementById(id).oninput=draw);draw();
</script>
</body></html>
